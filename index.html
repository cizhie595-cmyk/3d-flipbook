<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D翻页电子书</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 背景粒子 -->
    <div class="bg-particles" id="particles"></div>

    <!-- 顶部导航 -->
    <header class="top-bar">
        <div class="logo">
            <span class="logo-icon">📖</span>
            <span class="logo-text">3D FlipBook</span>
        </div>
        <div class="controls">
            <button id="btn-fullscreen" class="ctrl-btn" title="全屏">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
        </div>
    </header>

    <!-- 书名区域 -->
    <div class="book-title-area">
        <h1 id="book-title" class="book-title">AI 副业实操手册</h1>
        <p id="book-subtitle" class="book-subtitle">从零开始，用AI打造你的第二收入</p>
    </div>

    <!-- 翻页书主体 -->
    <div class="book-container">
        <div id="flipbook" class="flipbook"></div>
    </div>

    <!-- 底部控制栏 -->
    <div class="bottom-bar">
        <button id="btn-prev" class="nav-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            <span>上一页</span>
        </button>
        <div class="page-info">
            <span id="page-current">1</span>
            <span class="page-sep">/</span>
            <span id="page-total">0</span>
        </div>
        <button id="btn-next" class="nav-btn">
            <span>下一页</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
    </div>

    <!-- 引流浮窗（可自定义） -->
    <div class="cta-float" id="cta-float">
        <div class="cta-content">
            <div class="cta-close" id="cta-close">&times;</div>
            <div class="cta-icon">🎁</div>
            <div class="cta-text">
                <strong>免费领取完整版</strong>
                <p>添加微信获取配套资料</p>
            </div>
            <div class="cta-wechat" id="cta-wechat">
                <span>微信号: <strong>your_wechat_id</strong></span>
            </div>
        </div>
    </div>

    <script src="js/page-flip.browser.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
